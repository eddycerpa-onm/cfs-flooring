faqs:
  - question: "What is the difference between solid hardwood and Luxury Vinyl Plank (LVP)?"
    answer: "Solid hardwood is 100% natural timber that can be sanded and refinished multiple times over decades, offering timeless luxury. LVP is a synthetic, layered flooring that realistically replicates wood or stone while being completely waterproof, highly scratch-resistant, and ideal for damp PNW climates, kitchens, basements, and pet owners."
  - question: "How do you handle moisture issues common in Oregon and Washington homes?"
    answer: "Before installation, we perform digital moisture testing on concrete slabs and wooden subfloors. We apply specialized vapor barriers and high-grade moisture-mitigating underlayments to ensure your hardwood or LVP remains dimensionally stable despite seasonal climate shifts in the Pacific Northwest."
  - question: "Can LVP or laminate be installed over existing flooring?"
    answer: "In many cases, floating LVP or rigid-core laminate can be installed over existing flat vinyl, tile, or subflooring, provided the base surface is level, clean, and structurally sound. Our team conducts a thorough site evaluation during your free estimate."
  - question: "How long does a typical hardwood or LVP installation take?"
    answer: "Most residential projects (1,000–2,500 sq ft) take between 2 to 4 days, depending on subfloor prep, room layout, and trimming detail. Commercial projects are scheduled to minimize business downtime, including after-hours installation."
