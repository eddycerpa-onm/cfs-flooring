faqs:
  - question: "Why do you use uncoupling membranes (like Schluter-Ditra) under tile?"
    answer: "Uncoupling membranes isolate the tile layer from subfloor expansion and contraction, preventing cracked tiles or split grout lines caused by seasonal moisture and temperature variations in Oregon and Washington homes."
  - question: "Are porcelain tiles better than ceramic tiles for moisture areas?"
    answer: "Yes, porcelain is denser, less porous (water absorption rate under 0.5%), and more scratch-resistant than ceramic, making it ideal for bathroom floors, walk-in showers, high-traffic commercial spaces, and outdoor applications."
  - question: "Can you install radiant floor heating beneath tile?"
    answer: "Absolutely! Tile is the best thermal conductor for electric floor warming systems. We integrate programmable smart thermostats beneath porcelain or marble tiles for luxurious warmth during cold PNW winters."
  - question: "Do you offer stain-resistant grout options?"
    answer: "Yes, we utilize high-performance epoxy and single-component acrylic grouts that never require sealing, resist mold/mildew growth, and stand up against harsh cleaning chemicals."
