faqs:
  - question: "How dust-free is your hardwood sanding process?"
    answer: "We utilize commercial HEPA dust containment systems connected directly to our sanding machinery. This captures up to 98% of airborne dust, protecting your HVAC filters, furniture, and indoor air quality."
  - question: "How many times can my hardwood floors be sanded and refinished?"
    answer: "Solid hardwood floors can typically be sanded 4 to 6 times throughout their life. Engineered hardwood with a thick top wear layer (3mm+) can usually be sanded 1 to 3 times."
  - question: "What is the difference between water-based and oil-based finishes?"
    answer: "Water-based polyurethanes dry fast (walkable in hours), have minimal odor/low VOCs, and keep the wood's natural non-yellowing clear coat. Oil-based polyurethanes provide a warm amber glow and cure slowly. We help you choose the best option based on your lifestyle."
  - question: "How long after refinishing can we walk on the floors and move furniture back?"
    answer: "Foot traffic with socks is usually allowed 24 hours after the final coat. Furniture can typically be carefully placed back after 3 to 5 days, while area rugs should wait 7 to 14 days until full cure."
