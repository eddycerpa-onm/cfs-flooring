faqs:
  - question: "How do you control dust during heavy tile or mortar demolition?"
    answer: "We seal off doorways with heavy plastic containment curtains, utilize negative air air-scrubbers with HEPA filters, and connect ride-on or walk-behind floor scrapers directly to high-efficiency dust extractors."
  - question: "Can you flatten uneven concrete or sagged wood subfloors before new floor installation?"
    answer: "Yes. Proper subfloor preparation is essential for floor longevity. We perform diamond grinding on high spots and pour self-leveling concrete over low spots to achieve strict floor flatness tolerances (1/8 inch within 10 feet)."
  - question: "What happens to the old flooring debris after removal?"
    answer: "We handle 100% of the cleanup, loading, and disposal. Recyclable materials like carpet padding and clean wood are separated and taken to local PNW recycling facilities whenever possible."
  - question: "How long does floor removal take for an average home?"
    answer: "Most residential tear-out projects (1,000–2,000 sq ft) are completed within 1 full day, leaving your subfloor completely clean, level, and ready for immediate new floor installation."
