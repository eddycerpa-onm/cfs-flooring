<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebGL Shader Slider</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>
</head>
<body class="flex flex-col justify-center items-center bg-[#0a0a0a] p-4 min-h-screen">

  <div class="relative bg-black border border-[#ff6b00] w-full max-w-[1024px] aspect-[1024/600]">
    <div id="webgl-container" class="absolute inset-0"></div>
    
    <div class="right-4 bottom-4 z-10 absolute flex gap-2">
      <button id="next-btn" class="bg-[#0a0a0a]/80 hover:bg-[#ff6b00] shadow-none backdrop-blur-sm px-6 py-2 border border-[#ff6b00] outline-none text-[#ff6b00] hover:text-[#0a0a0a] text-sm uppercase tracking-widest transition-colors">
        Siguiente
      </button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <script>
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    
    const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const loader = new THREE.TextureLoader();
    loader.setCrossOrigin('anonymous');
    
    const images = [
      'https://images.unsplash.com/photo-1550684848-fac1c5b4e853?w=1024&h=600&fit=crop',
      'https://images.unsplash.com/photo-1555099962-4199c345e5dd?w=1024&h=600&fit=crop',
      'https://images.unsplash.com/photo-1518770660439-4636190af475?w=1024&h=600&fit=crop'
    ];
    
    let textures = [];
    let currentIndex = 0;
    let isAnimating = false;

    const vertexShader = `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `;

    const fragmentShader = `
      uniform sampler2D tex1;
      uniform sampler2D tex2;
      uniform float progress;
      varying vec2 vUv;

      void main() {
        vec2 uv = vUv;
        float pr = progress;
        
        float wave = sin(uv.y * 15.0 + pr * 10.0) * 0.1 * sin(pr * 3.1415);
        vec2 uv1 = uv + vec2(wave, 0.0);
        vec2 uv2 = uv - vec2(wave, 0.0);
        
        float r1 = texture2D(tex1, uv1 + vec2(0.03 * sin(pr*3.14), 0.0)).r;
        float g1 = texture2D(tex1, uv1).g;
        float b1 = texture2D(tex1, uv1 - vec2(0.03 * sin(pr*3.14), 0.0)).b;
        vec4 c1 = vec4(r1, g1, b1, 1.0);
        
        float r2 = texture2D(tex2, uv2 + vec2(0.03 * sin(pr*3.14), 0.0)).r;
        float g2 = texture2D(tex2, uv2).g;
        float b2 = texture2D(tex2, uv2 - vec2(0.03 * sin(pr*3.14), 0.0)).b;
        vec4 c2 = vec4(r2, g2, b2, 1.0);
        
        gl_FragColor = mix(c1, c2, pr);
      }
    `;

    const material = new THREE.ShaderMaterial({
      uniforms: {
        progress: { value: 0.0 },
        tex1: { value: null },
        tex2: { value: null }
      },
      vertexShader: vertexShader,
      fragmentShader: fragmentShader
    });

    const geometry = new THREE.PlaneGeometry(2, 2);
    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    Promise.all(images.map(src => new Promise(res => loader.load(src, res)))).then(loaded => {
      textures = loaded;
      material.uniforms.tex1.value = textures[0];
      material.uniforms.tex2.value = textures[1];
      renderer.render(scene, camera);
    });

    function nextSlide() {
      if (isAnimating || textures.length === 0) return;
      isAnimating = true;
      
      const nextIndex = (currentIndex + 1) % textures.length;
      material.uniforms.tex2.value = textures[nextIndex];
      
      gsap.to(material.uniforms.progress, {
        value: 1.0,
        duration: 1.4,
        ease: "power2.inOut",
        onUpdate: () => renderer.render(scene, camera),
        onComplete: () => {
          currentIndex = nextIndex;
          material.uniforms.tex1.value = textures[currentIndex];
          material.uniforms.progress.value = 0.0;
          renderer.render(scene, camera);
          isAnimating = false;
        }
      });
    }

    document.getElementById('next-btn').addEventListener('click', nextSlide);

    window.addEventListener('resize', () => {
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
